server:
  port: 9000

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:./logs/sentinel}
      filter:
        enabled: false
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: application/json;charset=UTF-8
          response-body: '{"code":429,"msg":"请求过于频繁，请稍后再试","isSuccess":false,"data":null}'
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - Authorization
                  - token
                maxAge: 3600
          routes:
            - id: auth-service-docs-route
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - SetPath=/v3/api-docs
            - id: system-service-docs-route
              uri: lb://system-service
              predicates:
                - Path=/v3/api-docs/system
              filters:
                - SetPath=/v3/api-docs
            - id: file-service-docs-route
              uri: lb://file-service
              predicates:
                - Path=/v3/api-docs/file
              filters:
                - SetPath=/v3/api-docs
            - id: log-service-docs-route
              uri: lb://log-service
              predicates:
                - Path=/v3/api-docs/log
              filters:
                - SetPath=/v3/api-docs
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: system-service-route
              uri: lb://system-service
              predicates:
                - Path=/system/**
            - id: file-service-route
              uri: lb://file-service
              predicates:
                - Path=/file/**
            - id: log-service-route
              uri: lb://log-service
              predicates:
                - Path=/log/**

knife4j:
  gateway:
    enabled: true
    strategy: MANUAL
    tags-sorter: alpha
    operations-sorter: alpha
    routes:
      - name: 认证服务
        service-name: auth-service
        url: /v3/api-docs/auth
        context-path: /
        order: 1
      - name: 系统服务
        service-name: system-service
        url: /v3/api-docs/system
        context-path: /
        order: 2
      - name: 文件服务
        service-name: file-service
        url: /v3/api-docs/file
        context-path: /
        order: 3
      - name: 日志服务
        service-name: log-service
        url: /v3/api-docs/log
        context-path: /
        order: 4

jwt:
  secret: abc123456abc123456abc123456abc123456

system:
  sentinel:
    login-qps: ${SENTINEL_LOGIN_QPS:5}
    user-search-qps: ${SENTINEL_USER_SEARCH_QPS:20}
    file-upload-qps: ${SENTINEL_FILE_UPLOAD_QPS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,sentinel
  endpoint:
    health:
      show-details: never
