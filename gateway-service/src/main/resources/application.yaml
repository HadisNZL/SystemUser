server:
  port: 9000

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: admin-system-route
              uri: lb://admin-system
              predicates:
                - Path=/sys/**,/captcha,/doc.html,/v3/api-docs/**,/webjars/**,/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
