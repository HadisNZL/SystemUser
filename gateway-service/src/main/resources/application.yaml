server:
  port: 9000

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - Authorization
                  - token
                maxAge: 3600
          routes:
            - id: admin-system-route
              uri: lb://admin-system
              predicates:
                - Path=/sys/**,/captcha,/doc.html,/v3/api-docs/**,/webjars/**,/actuator/health

jwt:
  secret: abc123456abc123456abc123456abc123456

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
