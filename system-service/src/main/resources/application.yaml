server:
  port: 9201

spring:
  application:
    name: system-service
  profiles:
    active: dev
  cloud:
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:./logs/sentinel}
  rabbitmq:
    template:
      observation-enabled: true

system:
  info:
    name: admin-system
    description: 企业级后台管理系统
    version: 0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan:
    - com.system.controller
    - com.system.system.controller
  paths-to-exclude: /internal/**

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,sentinel
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
