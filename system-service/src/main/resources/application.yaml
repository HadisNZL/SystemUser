server:
  port: 9201

spring:
  application:
    name: system-service
  profiles:
    active: dev
  cloud:
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:./logs/sentinel}

system:
  info:
    name: admin-system
    description: 企业级后台管理系统
    version: 0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan:
    - com.system.controller
    - com.system.system.controller
  paths-to-exclude: /internal/**

management:
  endpoints:
    web:
      exposure:
        include: health,sentinel
  endpoint:
    health:
      show-details: never
