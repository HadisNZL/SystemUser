server:
  port: 8080  # 默认端口，各环境也可以按需覆写

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/admin_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 123456

# 开发环境开启 MyBatis-Plus 的 SQL 打印，方便调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
    com.system: debug

#开发环境：开启文档
knife4j:
  production: false

jwt:
  # 密钥 生产环境一定要更换长字符串，禁止明文硬编码在代码
  secret: abc123456abc123456abc123456abc123456
  # 过期时间 单位：秒 7200=2小时
  expire: 7200
