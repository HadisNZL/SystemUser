# 本地开发编排：网关、认证、系统、文件、日志服务和中间件。
# 数据使用 Docker named volume 保存，配置/初始化/备份文件放在项目 docker 目录。
services:
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    image: gateway-service:latest
    container_name: gateway-service
    restart: unless-stopped
    depends_on:
      - auth-service
      - system-service
      - file-service
      - log-service
      - nacos
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9000:9000"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - system-service
      - redis
      - nacos
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9101:9101"

  system-service:
    build:
      context: ./system-service
      dockerfile: Dockerfile
    image: system-service:latest
    container_name: system-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - nacos
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9201:9201"

  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    image: file-service:latest
    container_name: file-service
    restart: unless-stopped
    depends_on:
      - mysql
      - rabbitmq
      - system-service
      - nacos
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PWD: 123456
      RABBITMQ_USER: guest
      RABBITMQ_PWD: guest
    ports:
      - "9401:9401"
    volumes:
      # 文件本体沿用原具名卷，迁移服务不会丢失数据。
      - admin_app_upload:/app/upload

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    image: log-service:latest
    container_name: log-service
    restart: unless-stopped
    depends_on:
      - mysql
      - rabbitmq
      - system-service
      - nacos
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PWD: 123456
      RABBITMQ_USER: guest
      RABBITMQ_PWD: guest
    ports:
      - "9301:9301"

  mysql:
    image: mysql:8.0
    container_name: admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      # MySQL真实数据，使用具名卷，避免污染项目目录。
      - admin_mysql_data:/var/lib/mysql
      # MySQL配置文件，可提交到Git。
      - ./docker/mysql/conf:/etc/mysql/conf.d
      # 初始化SQL目录，仅在MySQL数据目录首次为空时自动执行。
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      # 备份目录，用于放mysqldump导出的SQL文件，不提交真实备份。
      - ./docker/mysql/backup:/backup

  redis:
    image: redis:7
    container_name: admin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      # Redis持久化数据，使用具名卷。
      - admin_redis_data:/data
      # Redis配置文件，可提交到Git。
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf

  rabbitmq:
    image: rabbitmq:3-management
    container_name: admin-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      # 服务端口，Spring Boot连接这个端口。
      - "5672:5672"
      # 管理页面端口：http://localhost:15672
      - "15672:15672"
    volumes:
      # RabbitMQ数据，使用具名卷。
      - admin_rabbitmq_data:/var/lib/rabbitmq

  nacos:
    # Nacos 2.x注册中心，v2.5.3支持Apple Silicon的arm64镜像。
    image: nacos/nacos-server:v2.5.3
    container_name: admin-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: false
      TZ: Asia/Shanghai
    ports:
      # Nacos控制台和OpenAPI端口：http://localhost:8848/nacos
      - "8848:8848"
      # Nacos 2.x gRPC通信端口，后续服务注册会用到。
      - "9848:9848"
      - "9849:9849"
    volumes:
      # Nacos本地数据，使用具名卷。
      - admin_nacos_data:/home/nacos/data

volumes:
  admin_app_upload:
  admin_mysql_data:
  admin_redis_data:
  admin_rabbitmq_data:
  admin_nacos_data:
