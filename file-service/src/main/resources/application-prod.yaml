spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
    sentinel:
      datasource:
        degrade-rules:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
            data-id: ${SENTINEL_FILE_DEGRADE_DATA_ID:file-service-sentinel-degrade-rules.json}
            group-id: ${SENTINEL_RULE_GROUP:DEFAULT_GROUP}
            rule-type: degrade
            data-type: json
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://mysql:3306/admin_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${DB_USER:root}
    password: ${DB_PWD:123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PWD:guest}

file:
  storage:
    upload-path: ${FILE_UPLOAD_PATH:/app/upload}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    root: warn
    com.system: info
