server:
  port: 9401

spring:
  application:
    name: file-service
  profiles:
    active: dev
  cloud:
    openfeign:
      micrometer:
        enabled: true
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:./logs/sentinel}
  rabbitmq:
    template:
      observation-enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

feign:
  sentinel:
    enabled: true

file:
  storage:
    upload-path: ./upload

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.system.controller

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,sentinel
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
