spring:
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/admin_system_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${DB_USER:root}
    password: ${DB_PWD:123456}
  rabbitmq:
    listener:
      simple:
        auto-startup: false

file:
  storage:
    upload-path: ./target/test-upload

logging:
  level:
    root: info
    com.system: info
