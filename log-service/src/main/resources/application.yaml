server:
  port: 9301

spring:
  application:
    name: log-service
  profiles:
    active: dev
  cloud:
    openfeign:
      micrometer:
        enabled: true
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:./logs/sentinel}
  rabbitmq:
    listener:
      simple:
        observation-enabled: true

feign:
  sentinel:
    enabled: true

system:
  operation-log:
    retention-days: 90
    clean-cron: "0 0 3 * * ?"

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.system.controller

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,sentinel
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
